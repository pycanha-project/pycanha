name: Tests

env:
  PYTHON_VERSIONS: '["3.13", "3.14"]'
  PYTHON_PRIMARY: "3.13"
  UV_VERSION: "0.5.11"

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ env.PYTHON_VERSIONS }}
      python-primary: ${{ env.PYTHON_PRIMARY }}
      uv-version: ${{ env.UV_VERSION }}
    steps:
      - name: Show Python versions under test
        run: |
          echo "Python versions under test: $PYTHON_VERSIONS"

  test:
    name: "pytest - ${{ matrix.os }} / Py ${{ matrix.python-version }}"
    needs: [setup]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ needs.setup.outputs.uv-version }}
          enable-cache: true
      # The Qt libraries the PySide6 wheels link against are not part of the
      # Linux runner image, and libQt6Gui needs them at *import* time: without
      # them the pytest-qt plugin raises "libEGL.so.1: cannot open shared
      # object file" while configuring, which aborts the whole session, not
      # just the viewer tests. The windows and macos wheels are self-contained,
      # so this is Linux-only. No X server is needed on top of these: the
      # viewer tests run on Qt's offscreen platform.
      - name: "Qt runtime libraries (Linux only)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      # Windows has no OpenGL of its own past the generic 1.1 renderer, and
      # VTK's backend needs 3.2: the first frame the viewer tests draw does not
      # raise there, it takes the interpreter down with an access violation and
      # the whole session with it. Mesa3D supplies a software implementation
      # and the osmesa.dll behind vtkOSOpenGLRenderWindow, which the action
      # then names in VTK_DEFAULT_OPENGL_WINDOW - a render window that needs no
      # window at all, which is what a runner with no desktop can offer. The
      # other two runners need nothing: the VTK wheel picks EGL over Mesa's
      # llvmpipe on Linux, which arrives with the Qt libraries above, and Cocoa
      # on macOS. ``pyvista: false`` because the tests ask for off-screen
      # plotters themselves; PYVISTA_OFF_SCREEN would make this one runner's
      # defaults differ from the rest.
      - name: "Software OpenGL (Windows only)"
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@b0bf9f57d62d2b3fee9f1c0e0c7e390f05e97a4e # v5.0.0
        with:
          pyvista: false
      - run: uv sync --locked
      - name: "pytest with coverage"
        env:
          JUNIT_XML: junit-${{ matrix.os }}-${{ matrix.python-version }}.xml
          # Every runner has a renderer, so a viewer test that cannot draw is a
          # failure here rather than the skip a developer without one gets.
          PYCANHA_REQUIRE_RENDERER: "1"
        run: >
          uv run pytest
          --cov=src/pycanha
          --cov-report=xml
          --cov-report=term
          --junitxml="$JUNIT_XML"
      - name: "Upload junit report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit-${{ matrix.os }}-${{ matrix.python-version }}.xml
      - name: "Upload coverage (linux/primary only)"
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == needs.setup.outputs.python-primary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  coverage-report:
    name: "Coverage report (non-blocking)"
    needs: [setup, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python-primary }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ needs.setup.outputs.uv-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: "Print coverage summary"
        run: uv run coverage report --rcfile=pyproject.toml || true

  test-gate:
    name: "Test gate (blocking)"
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Verify test matrix succeeded"
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test matrix failed."
            exit 1
          fi
          echo "All tests passed."