version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # Headless OpenGL + virtual framebuffer so the GMM examples can render with
  # pyvista/VTK during the docs build (see doc/conf.py).
  apt_packages:
    - xvfb
    - libgl1
    - libglx-mesa0
    - libgl1-mesa-dri
    - libxrender1
    - libxext6

sphinx:
  configuration: doc/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
